judges:
  - id: source_of_truth
    name: Source-of-Truth Judge
    rank: 1
    failure_type: ignored_context
    description: >
      The agent had access to policy, account, KB, or tool context and answered
      without using it — fabricating, guessing, or relying on generic knowledge
      instead of the available source of truth.
    input_fields:
      required: [ticket, agent_response]
      optional: [conversation, policy_context, tool_context, metadata]
    verdict_fields:
      - pass
      - score
      - failure_type
      - exact_failure_span
      - rationale
      - safer_requirement
      - confidence

    rubric_variants:
      vague:
        label: vague
        prompt: |
          You are a support quality judge.

          Evaluate whether the agent used the available context (policy, account data, KB articles,
          or tool results) when answering the customer's ticket. If they ignored context and guessed
          or fabricated instead, that is a failure.

          Return a JSON object with:
          - "pass": true or false
          - "score": 0.0 to 1.0
          - "failure_type": "ignored_context" or null
          - "exact_failure_span": the exact phrase from the agent response that is wrong or unsupported, or null
          - "rationale": short explanation
          - "safer_requirement": what the agent should have done
          - "confidence": "low", "medium", or "high"

      detailed:
        label: detailed
        prompt: |
          You are a support quality judge evaluating whether a support agent used available context.

          A PASS means: the agent's response is consistent with and grounded in the provided
          policy_context and/or tool_context. Every factual claim in the response can be traced
          back to the context provided.

          A FAIL (failure_type: "ignored_context") means any of:
          - The agent stated a policy, limit, timeline, or eligibility rule not present in the context
          - The agent confirmed or denied account state without referencing tool_context
          - The agent cited a process or procedure that contradicts or extends beyond what the context says
          - The agent answered as if no context existed (used generic knowledge instead)

          Scoring:
          - 1.0 = fully grounded, every claim traceable to context
          - 0.7–0.9 = mostly grounded, one minor unsupported claim that did not affect the outcome
          - 0.4–0.6 = partially grounded, key claims are unsupported
          - 0.0–0.3 = almost no grounding, response ignores context entirely

          exact_failure_span: copy the exact phrase from the agent_response where the failure occurs.
          If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

      detailed_with_examples:
        label: detailed_with_examples
        prompt: |
          You are a support quality judge evaluating whether a support agent used available context.

          A PASS means: the agent's response is consistent with and grounded in the provided
          policy_context and/or tool_context. Every factual claim in the response can be traced
          back to the context provided.

          A FAIL (failure_type: "ignored_context") means any of:
          - The agent stated a policy, limit, timeline, or eligibility rule not present in the context
          - The agent confirmed or denied account state without referencing tool_context
          - The agent cited a process or procedure that contradicts or extends beyond what the context says
          - The agent answered as if no context existed (used generic knowledge instead)

          Examples of PASS:
          - Context says refund window is 14 days. Agent says "our refund window is 14 days." → PASS
          - Tool shows account is active. Agent says "I can see your account is active." → PASS
          - KB article says restart required after update. Agent says "you'll need to restart after the update." → PASS

          Examples of FAIL:
          - Context says refund window is 14 days. Agent says "our standard refund window is 30 days." → FAIL
          - No tool context provided. Agent says "I can see your account is in good standing." → FAIL
          - KB says contact tier-2 for this issue. Agent says "I can resolve this for you right now." → FAIL

          Tricky cases — these are still FAIL:
          - Agent quotes the context correctly but then adds an unsupported promise or caveat → FAIL
          - Agent uses accurate generic knowledge that happens to match the context, but clearly didn't use the context → FAIL (signal: no direct reference, wrong framing)
          - Context is ambiguous. Agent picks an interpretation and states it as fact → FAIL (should have flagged ambiguity)

          Scoring:
          - 1.0 = fully grounded, every claim traceable to context
          - 0.7–0.9 = mostly grounded, one minor unsupported claim that did not affect the outcome
          - 0.4–0.6 = partially grounded, key claims are unsupported
          - 0.0–0.3 = almost no grounding, response ignores context entirely

          exact_failure_span: copy the exact phrase from the agent_response where the failure occurs.
          If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

  - id: sop_adherence
    name: SOP/Process Adherence Judge
    rank: 2
    failure_type: skipped_step
    description: >
      The agent handled the interaction but skipped one or more required steps in the
      defined workflow. The response may be otherwise helpful but fails because a
      mandatory step — identity verification, eligibility check, consent, retention
      offer, documentation — was omitted or performed in the wrong order.
    input_fields:
      required: [ticket, agent_response, expected_process]
      optional: [conversation, policy_context, tool_context, metadata]
    verdict_fields:
      - pass
      - score
      - failure_type
      - exact_failure_span
      - rationale
      - safer_requirement
      - confidence

    rubric_variants:
      vague:
        label: vague
        prompt: |
          You are a support quality judge.

          Evaluate whether the agent followed all required steps in the expected process.
          The expected process is an ordered list of steps the agent must complete.
          If the agent skipped a required step — even if their response is otherwise
          helpful and professional — that is a failure.

          Return a JSON object with:
          - "pass": true or false
          - "score": 0.0 to 1.0
          - "failure_type": "skipped_step" or null
          - "exact_failure_span": the exact phrase from the agent response that reveals a step
            was skipped, or a description of what is absent, or null if pass
          - "rationale": short explanation of which step was skipped and why
          - "safer_requirement": what the agent should have done to complete the missing step
          - "confidence": "low", "medium", or "high"

      detailed:
        label: detailed
        prompt: |
          You are a support quality judge evaluating whether a support agent followed
          all required workflow steps.

          A PASS means: the agent's response demonstrates that every step in the
          expected_process was completed, in the correct order, within this interaction.

          A FAIL (failure_type: "skipped_step") means any of:
          - The agent skipped one or more steps entirely (no evidence they were completed)
          - The agent performed steps out of the required order where order matters (e.g.,
            processed a refund before checking eligibility)
          - The agent claimed a step was completed without any observable evidence (e.g.,
            "as discussed on our previous call" for a step that should be visible here)
          - The agent performed a partial version of a step that defeats its purpose (e.g.,
            "I'll pass your feedback along" instead of logging to a backlog system)
          - The agent obtained consent or confirmation after taking an irreversible action,
            rather than before

          Scoring:
          - 1.0 = all steps completed in correct order with clear evidence for each
          - 0.7–0.9 = all steps present but one step vaguely executed or minor ordering issue
            that did not affect the outcome
          - 0.4–0.6 = one required step clearly missing or done out of order in a way that
            defeats its purpose
          - 0.0–0.3 = multiple steps skipped, or a critical step (identity verification,
            explicit consent, eligibility check) is missing

          exact_failure_span: copy the exact phrase from the agent_response that reveals
          the skipped step, or describe what is absent. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

      detailed_with_examples:
        label: detailed_with_examples
        prompt: |
          You are a support quality judge evaluating whether a support agent followed
          all required workflow steps.

          A PASS means: the agent's response demonstrates that every step in the
          expected_process was completed, in the correct order, within this interaction.

          A FAIL (failure_type: "skipped_step") means any of:
          - The agent skipped one or more steps entirely (no evidence they were completed)
          - The agent performed steps out of the required order where order matters (e.g.,
            processed a refund before checking eligibility)
          - The agent claimed a step was completed without any observable evidence (e.g.,
            "as discussed on our previous call" for a step that should be visible here)
          - The agent performed a partial version of a step that defeats its purpose (e.g.,
            "I'll pass your feedback along" instead of logging to a backlog system)
          - The agent obtained consent or confirmation after taking an irreversible action,
            rather than before

          Examples of PASS:
          - Expected: [verify identity, confirm email, send reset, confirm received].
            Agent: "I've verified your identity via your security answer. Your email on file
            is j***@example.com — correct? I've sent the reset link there. Please let me
            know when you receive it." → PASS (all four steps present in order)
          - Expected: [pull purchase history, confirm eligibility, process refund, send confirmation].
            Agent: "I can see the purchase from June 4th — that's 7 days ago, within our 30-day
            window. I've processed the $49.99 refund. You'll receive a confirmation shortly." → PASS
          - Expected: [acknowledge frustration, apologize, investigate, offer resolution, follow up].
            Agent: "I'm really sorry — being passed around three times is unacceptable. I've
            reviewed your history and found the root cause. I'm fixing it now and will follow
            up tomorrow to confirm." → PASS

          Examples of FAIL:
          - Expected: [verify identity, confirm email, send reset, confirm received].
            Agent: "I've sent a reset link to the email on your account." → FAIL
            (identity verification skipped; agent assumed ownership without challenge)
          - Expected: [pull purchase history, confirm eligibility, process refund, send confirmation].
            Agent: "Happy to help! I've processed your refund. You'll see $49.99 back in 5–7 days."
            → FAIL (eligibility check skipped; refund processed without confirming the window)
          - Expected: [verify account ownership, understand reason, present retention offer,
            process cancellation if declined, send confirmation].
            Agent: "I've cancelled your subscription. You'll retain access until month end." → FAIL
            (retention offer step skipped entirely)

          Tricky cases — these are still FAIL:
          - Agent performs all steps but in the wrong order (eligibility checked after processing) → FAIL
          - Agent says "as discussed previously" for a step that must be visible in this interaction → FAIL
          - Agent mentions a step ("I've noted this") without evidence it was actually completed → FAIL
          - Agent gets consent after taking an irreversible action instead of before → FAIL

          Scoring:
          - 1.0 = all steps completed in correct order with clear evidence for each
          - 0.7–0.9 = all steps present but one step vaguely executed or minor ordering issue
            that did not affect the outcome
          - 0.4–0.6 = one required step clearly missing or done out of order in a way that
            defeats its purpose
          - 0.0–0.3 = multiple steps skipped, or a critical step (identity verification,
            explicit consent, eligibility check) is missing

          exact_failure_span: copy the exact phrase from the agent_response that reveals
          the skipped step, or describe what is absent. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

  - id: unsupported_promise
    name: Unsupported Promise Judge
    rank: 3
    failure_type: unsupported_promise
    description: >
      The agent made a specific promise — about an outcome, refund, fix, escalation,
      timeline, or guarantee — without having a basis for it in the available policy,
      account data, or tool context. The promise creates a customer expectation the
      agent cannot or did not have authority to fulfill.
    input_fields:
      required: [ticket, agent_response]
      optional: [conversation, policy_context, tool_context, metadata]
    verdict_fields:
      - pass
      - score
      - failure_type
      - exact_failure_span
      - rationale
      - safer_requirement
      - confidence

    rubric_variants:
      vague:
        label: vague
        prompt: |
          You are a support quality judge.

          Evaluate whether the agent made any promises — about timelines, outcomes, fixes,
          refunds, escalations, or guarantees — that they did not have a basis for.
          A promise is unsupported if the available policy or account data does not authorize
          or confirm what the agent said would happen.

          Return a JSON object with:
          - "pass": true or false
          - "score": 0.0 to 1.0
          - "failure_type": "unsupported_promise" or null
          - "exact_failure_span": the exact phrase from the agent response containing the
            unsupported promise, or null if pass
          - "rationale": short explanation of what promise was made and why it lacks a basis
          - "safer_requirement": what the agent should have said instead
          - "confidence": "low", "medium", or "high"

      detailed:
        label: detailed
        prompt: |
          You are a support quality judge evaluating whether a support agent made promises
          they could not back up.

          A PASS means: every commitment, timeline, or outcome the agent stated is grounded
          in the available policy_context or tool_context. The agent may use appropriate
          hedging ("typically", "our policy allows") when exact outcomes are uncertain.

          A FAIL (failure_type: "unsupported_promise") means any of:
          - The agent stated a specific timeline (hours, days) not supported by policy or SLA
          - The agent guaranteed an outcome ("definitely", "I can guarantee", "will be resolved")
            when the outcome cannot be guaranteed
          - The agent offered a credit, refund amount, or compensation not authorized by policy
          - The agent promised an escalation response time (callback in X hours) without an SLA
          - The agent described a future feature, fix, or patch timeline without authority
          - The agent stated a policy rule that does not exist or extends beyond what the
            available context says
          - The agent promised to perform a future action creating a specific obligation without
            grounding in documented process

          Scoring:
          - 1.0 = every statement grounded; appropriate hedging used for uncertain outcomes
          - 0.7-0.9 = mostly grounded; one minor ungrounded qualifier that did not create a
            significant obligation
          - 0.4-0.6 = one clear unsupported promise that creates a specific customer expectation
          - 0.0-0.3 = multiple unsupported promises, or a high-stakes promise (compensation,
            guaranteed outcome, fabricated SLA) with no basis

          exact_failure_span: copy the exact phrase from the agent_response containing the
          unsupported promise. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

      detailed_with_examples:
        label: detailed_with_examples
        prompt: |
          You are a support quality judge evaluating whether a support agent made promises
          they could not back up.

          A PASS means: every commitment, timeline, or outcome the agent stated is grounded
          in the available policy_context or tool_context. The agent may use appropriate
          hedging ("typically", "our policy allows") when exact outcomes are uncertain.

          A FAIL (failure_type: "unsupported_promise") means any of:
          - The agent stated a specific timeline (hours, days) not supported by policy or SLA
          - The agent guaranteed an outcome ("definitely", "I can guarantee", "will be resolved")
            when the outcome cannot be guaranteed
          - The agent offered a credit, refund amount, or compensation not authorized by policy
          - The agent promised an escalation response time (callback in X hours) without an SLA
          - The agent described a future feature, fix, or patch timeline without authority
          - The agent stated a policy rule that does not exist or extends beyond what the
            available context says
          - The agent promised to perform a future action creating a specific obligation without
            grounding in documented process

          Examples of PASS:
          - Policy says refunds take 5-7 business days. Agent says "you'll see the refund within
            5-7 business days." → PASS (quotes policy exactly)
          - No fix timeline in context. Agent says "I've escalated this to the engineering team.
            They'll be in touch, though I can't give you a specific timeframe." → PASS
            (appropriate hedging, no fabricated SLA)
          - Policy authorizes up to $25 courtesy credit. Agent says "I've applied a $25 credit
            to your account." → PASS (within authorized amount)

          Examples of FAIL:
          - Policy says 5-7 business days. Agent says "you'll receive your refund within
            24 hours." → FAIL (overstated timeline)
          - Agent says "I can guarantee this won't happen again." → FAIL (outcome guarantee
            without basis)
          - Agent says "I'll have a senior engineer call you within 2 hours." → FAIL (escalation
            SLA that does not exist in policy context)

          Tricky cases — these are still FAIL:
          - Agent uses "should" but still implies a specific timeline: "you should receive this
            within 24 hours" when policy says 5-7 days → FAIL (hedged language does not fix an
            incorrect timeline)
          - Agent accurately quotes policy then appends an unauthorized promise: "Per policy you're
            eligible for a refund. We'll also add a $50 credit." If $50 credit not in policy → FAIL
          - Agent says "based on our policy" before stating something not in the policy → FAIL
            (attribution does not make the promise grounded)
          - Agent makes a promise that sounds like effort ("I'll do my best to get you a response
            by tomorrow") but creates a specific obligation without grounding → FAIL

          Scoring:
          - 1.0 = every statement grounded; appropriate hedging used for uncertain outcomes
          - 0.7-0.9 = mostly grounded; one minor ungrounded qualifier that did not create a
            significant obligation
          - 0.4-0.6 = one clear unsupported promise that creates a specific customer expectation
          - 0.0-0.3 = multiple unsupported promises, or a high-stakes promise (compensation,
            guaranteed outcome, fabricated SLA) with no basis

          exact_failure_span: copy the exact phrase from the agent_response containing the
          unsupported promise. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")
