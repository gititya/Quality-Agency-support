judges:
  - id: source_of_truth
    name: Source-of-Truth Judge
    rank: 1
    failure_type: ignored_context
    description: >
      The agent had access to policy, account, KB, or tool context and answered
      without using it — fabricating, guessing, or relying on generic knowledge
      instead of the available source of truth.
    input_fields:
      required: [ticket, agent_response]
      optional: [conversation, policy_context, tool_context, metadata]
    verdict_fields:
      - pass
      - score
      - failure_type
      - exact_failure_span
      - rationale
      - safer_requirement
      - confidence

    rubric_variants:
      vague:
        label: vague
        prompt: |
          You are a support quality judge.

          Evaluate whether the agent used the available context (policy, account data, KB articles,
          or tool results) when answering the customer's ticket. If they ignored context and guessed
          or fabricated instead, that is a failure.

          Return a JSON object with:
          - "pass": true or false
          - "score": 0.0 to 1.0
          - "failure_type": "ignored_context" or null
          - "exact_failure_span": the exact phrase from the agent response that is wrong or unsupported, or null
          - "rationale": short explanation
          - "safer_requirement": what the agent should have done
          - "confidence": "low", "medium", or "high"

      detailed:
        label: detailed
        prompt: |
          You are a support quality judge evaluating whether a support agent used available context.

          A PASS means: the agent's response is consistent with and grounded in the provided
          policy_context and/or tool_context. Every factual claim in the response can be traced
          back to the context provided.

          A FAIL (failure_type: "ignored_context") means any of:
          - The agent stated a policy, limit, timeline, or eligibility rule not present in the context
          - The agent confirmed or denied account state without referencing tool_context
          - The agent cited a process or procedure that contradicts or extends beyond what the context says
          - The agent answered as if no context existed (used generic knowledge instead)

          Scoring:
          - 1.0 = fully grounded, every claim traceable to context
          - 0.7–0.9 = mostly grounded, one minor unsupported claim that did not affect the outcome
          - 0.4–0.6 = partially grounded, key claims are unsupported
          - 0.0–0.3 = almost no grounding, response ignores context entirely

          exact_failure_span: copy the exact phrase from the agent_response where the failure occurs.
          If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

      detailed_with_examples:
        label: detailed_with_examples
        prompt: |
          You are a support quality judge evaluating whether a support agent used available context.

          A PASS means: the agent's response is consistent with and grounded in the provided
          policy_context and/or tool_context. Every factual claim in the response can be traced
          back to the context provided.

          A FAIL (failure_type: "ignored_context") means any of:
          - The agent stated a policy, limit, timeline, or eligibility rule not present in the context
          - The agent confirmed or denied account state without referencing tool_context
          - The agent cited a process or procedure that contradicts or extends beyond what the context says
          - The agent answered as if no context existed (used generic knowledge instead)

          Examples of PASS:
          - Context says refund window is 14 days. Agent says "our refund window is 14 days." → PASS
          - Tool shows account is active. Agent says "I can see your account is active." → PASS
          - KB article says restart required after update. Agent says "you'll need to restart after the update." → PASS

          Examples of FAIL:
          - Context says refund window is 14 days. Agent says "our standard refund window is 30 days." → FAIL
          - No tool context provided. Agent says "I can see your account is in good standing." → FAIL
          - KB says contact tier-2 for this issue. Agent says "I can resolve this for you right now." → FAIL

          Tricky cases — these are still FAIL:
          - Agent quotes the context correctly but then adds an unsupported promise or caveat → FAIL
          - Agent uses accurate generic knowledge that happens to match the context, but clearly didn't use the context → FAIL (signal: no direct reference, wrong framing)
          - Context is ambiguous. Agent picks an interpretation and states it as fact → FAIL (should have flagged ambiguity)

          Scoring:
          - 1.0 = fully grounded, every claim traceable to context
          - 0.7–0.9 = mostly grounded, one minor unsupported claim that did not affect the outcome
          - 0.4–0.6 = partially grounded, key claims are unsupported
          - 0.0–0.3 = almost no grounding, response ignores context entirely

          exact_failure_span: copy the exact phrase from the agent_response where the failure occurs.
          If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

  - id: sop_adherence
    name: SOP/Process Adherence Judge
    rank: 2
    failure_type: skipped_step
    description: >
      The agent handled the interaction but skipped one or more required steps in the
      defined workflow. The response may be otherwise helpful but fails because a
      mandatory step — identity verification, eligibility check, consent, retention
      offer, documentation — was omitted or performed in the wrong order.
    input_fields:
      required: [ticket, agent_response, expected_process]
      optional: [conversation, policy_context, tool_context, metadata]
    verdict_fields:
      - pass
      - score
      - failure_type
      - exact_failure_span
      - rationale
      - safer_requirement
      - confidence

    rubric_variants:
      vague:
        label: vague
        prompt: |
          You are a support quality judge.

          Evaluate whether the agent followed all required steps in the expected process.
          The expected process is an ordered list of steps the agent must complete.
          If the agent skipped a required step — even if their response is otherwise
          helpful and professional — that is a failure.

          Return a JSON object with:
          - "pass": true or false
          - "score": 0.0 to 1.0
          - "failure_type": "skipped_step" or null
          - "exact_failure_span": the exact phrase from the agent response that reveals a step
            was skipped, or a description of what is absent, or null if pass
          - "rationale": short explanation of which step was skipped and why
          - "safer_requirement": what the agent should have done to complete the missing step
          - "confidence": "low", "medium", or "high"

      detailed:
        label: detailed
        prompt: |
          You are a support quality judge evaluating whether a support agent followed
          all required workflow steps.

          A PASS means: the agent's response demonstrates that every step in the
          expected_process was completed, in the correct order, within this interaction.

          A FAIL (failure_type: "skipped_step") means any of:
          - The agent skipped one or more steps entirely (no evidence they were completed)
          - The agent performed steps out of the required order where order matters (e.g.,
            processed a refund before checking eligibility)
          - The agent claimed a step was completed without any observable evidence (e.g.,
            "as discussed on our previous call" for a step that should be visible here)
          - The agent performed a partial version of a step that defeats its purpose (e.g.,
            "I'll pass your feedback along" instead of logging to a backlog system)
          - The agent obtained consent or confirmation after taking an irreversible action,
            rather than before

          Scoring:
          - 1.0 = all steps completed in correct order with clear evidence for each
          - 0.7–0.9 = all steps present but one step vaguely executed or minor ordering issue
            that did not affect the outcome
          - 0.4–0.6 = one required step clearly missing or done out of order in a way that
            defeats its purpose
          - 0.0–0.3 = multiple steps skipped, or a critical step (identity verification,
            explicit consent, eligibility check) is missing

          exact_failure_span: copy the exact phrase from the agent_response that reveals
          the skipped step, or describe what is absent. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

      detailed_with_examples:
        label: detailed_with_examples
        prompt: |
          You are a support quality judge evaluating whether a support agent followed
          all required workflow steps.

          A PASS means: the agent's response demonstrates that every step in the
          expected_process was completed, in the correct order, within this interaction.

          A FAIL (failure_type: "skipped_step") means any of:
          - The agent skipped one or more steps entirely (no evidence they were completed)
          - The agent performed steps out of the required order where order matters (e.g.,
            processed a refund before checking eligibility)
          - The agent claimed a step was completed without any observable evidence (e.g.,
            "as discussed on our previous call" for a step that should be visible here)
          - The agent performed a partial version of a step that defeats its purpose (e.g.,
            "I'll pass your feedback along" instead of logging to a backlog system)
          - The agent obtained consent or confirmation after taking an irreversible action,
            rather than before

          Examples of PASS:
          - Expected: [verify identity, confirm email, send reset, confirm received].
            Agent: "I've verified your identity via your security answer. Your email on file
            is j***@example.com — correct? I've sent the reset link there. Please let me
            know when you receive it." → PASS (all four steps present in order)
          - Expected: [pull purchase history, confirm eligibility, process refund, send confirmation].
            Agent: "I can see the purchase from June 4th — that's 7 days ago, within our 30-day
            window. I've processed the $49.99 refund. You'll receive a confirmation shortly." → PASS
          - Expected: [acknowledge frustration, apologize, investigate, offer resolution, follow up].
            Agent: "I'm really sorry — being passed around three times is unacceptable. I've
            reviewed your history and found the root cause. I'm fixing it now and will follow
            up tomorrow to confirm." → PASS

          Examples of FAIL:
          - Expected: [verify identity, confirm email, send reset, confirm received].
            Agent: "I've sent a reset link to the email on your account." → FAIL
            (identity verification skipped; agent assumed ownership without challenge)
          - Expected: [pull purchase history, confirm eligibility, process refund, send confirmation].
            Agent: "Happy to help! I've processed your refund. You'll see $49.99 back in 5–7 days."
            → FAIL (eligibility check skipped; refund processed without confirming the window)
          - Expected: [verify account ownership, understand reason, present retention offer,
            process cancellation if declined, send confirmation].
            Agent: "I've cancelled your subscription. You'll retain access until month end." → FAIL
            (retention offer step skipped entirely)

          Tricky cases — these are still FAIL:
          - Agent performs all steps but in the wrong order (eligibility checked after processing) → FAIL
          - Agent says "as discussed previously" for a step that must be visible in this interaction → FAIL
          - Agent mentions a step ("I've noted this") without evidence it was actually completed → FAIL
          - Agent gets consent after taking an irreversible action instead of before → FAIL

          Scoring:
          - 1.0 = all steps completed in correct order with clear evidence for each
          - 0.7–0.9 = all steps present but one step vaguely executed or minor ordering issue
            that did not affect the outcome
          - 0.4–0.6 = one required step clearly missing or done out of order in a way that
            defeats its purpose
          - 0.0–0.3 = multiple steps skipped, or a critical step (identity verification,
            explicit consent, eligibility check) is missing

          exact_failure_span: copy the exact phrase from the agent_response that reveals
          the skipped step, or describe what is absent. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

  - id: unsupported_promise
    name: Unsupported Promise Judge
    rank: 3
    failure_type: unsupported_promise
    description: >
      The agent made a specific promise — about an outcome, refund, fix, escalation,
      timeline, or guarantee — without having a basis for it in the available policy,
      account data, or tool context. The promise creates a customer expectation the
      agent cannot or did not have authority to fulfill.
    input_fields:
      required: [ticket, agent_response]
      optional: [conversation, policy_context, tool_context, metadata]
    verdict_fields:
      - pass
      - score
      - failure_type
      - exact_failure_span
      - rationale
      - safer_requirement
      - confidence

    rubric_variants:
      vague:
        label: vague
        prompt: |
          You are a support quality judge.

          Evaluate whether the agent made any promises — about timelines, outcomes, fixes,
          refunds, escalations, or guarantees — that they did not have a basis for.
          A promise is unsupported if the available policy or account data does not authorize
          or confirm what the agent said would happen.

          Do not treat a refusal to promise as an unsupported promise. Phrases like
          "I cannot promise", "I cannot guarantee", "I can't confirm yet", or
          "this needs review first" are safe expectation-setting unless the agent also
          makes a separate unsupported commitment.

          Judge only unsupported commitments. Do not fail this judge for process gaps,
          weak handoff notes, or technical diagnosis issues unless they contain an
          unsupported promise.

          Return a JSON object with:
          - "pass": true or false
          - "score": 0.0 to 1.0
          - "failure_type": "unsupported_promise" or null
          - "exact_failure_span": the exact phrase from the agent response containing the
            unsupported promise, or null if pass
          - "rationale": short explanation of what promise was made and why it lacks a basis
          - "safer_requirement": what the agent should have said instead
          - "confidence": "low", "medium", or "high"

      detailed:
        label: detailed
        prompt: |
          You are a support quality judge evaluating whether a support agent made promises
          they could not back up.

          A PASS means: every commitment, timeline, or outcome the agent stated is grounded
          in the available policy_context or tool_context. The agent may use appropriate
          hedging ("typically", "our policy allows") when exact outcomes are uncertain.
          Explicitly declining to promise or guarantee an outcome is a PASS for this judge
          unless the same response makes another unsupported commitment.

          A FAIL (failure_type: "unsupported_promise") means any of:
          - The agent stated a specific timeline (hours, days) not supported by policy or SLA
          - The agent guaranteed an outcome ("definitely", "I can guarantee", "will be resolved")
            when the outcome cannot be guaranteed
          - The agent offered a credit, refund amount, or compensation not authorized by policy
          - The agent promised an escalation response time (callback in X hours) without an SLA
          - The agent described a future feature, fix, or patch timeline without authority
          - The agent stated a policy rule that does not exist or extends beyond what the
            available context says
          - The agent promised to perform a future action creating a specific obligation without
            grounding in documented process

          These are PASS, not failures:
          - "I cannot promise a full backfill until integrations review."
          - "I can't guarantee recovery yet; first we need to confirm the receiver is fixed."
          - "I do not have a confirmed timeline, but I can escalate with the logs."

          Scoring:
          - 1.0 = every statement grounded; appropriate hedging used for uncertain outcomes
          - 0.7-0.9 = mostly grounded; one minor ungrounded qualifier that did not create a
            significant obligation
          - 0.4-0.6 = one clear unsupported promise that creates a specific customer expectation
          - 0.0-0.3 = multiple unsupported promises, or a high-stakes promise (compensation,
            guaranteed outcome, fabricated SLA) with no basis

          exact_failure_span: copy the exact phrase from the agent_response containing the
          unsupported promise. If pass, set to null.

          Judge only unsupported commitments. Do not fail this judge for skipped process
          steps, weak handoff notes, or technical-diagnosis quality unless the same text
          contains an unsupported promise.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

      detailed_with_examples:
        label: detailed_with_examples
        prompt: |
          You are a support quality judge evaluating whether a support agent made promises
          they could not back up.

          A PASS means: every commitment, timeline, or outcome the agent stated is grounded
          in the available policy_context or tool_context. The agent may use appropriate
          hedging ("typically", "our policy allows") when exact outcomes are uncertain.
          Explicitly declining to promise or guarantee an outcome is a PASS for this judge
          unless the same response makes another unsupported commitment.

          A FAIL (failure_type: "unsupported_promise") means any of:
          - The agent stated a specific timeline (hours, days) not supported by policy or SLA
          - The agent guaranteed an outcome ("definitely", "I can guarantee", "will be resolved")
            when the outcome cannot be guaranteed
          - The agent offered a credit, refund amount, or compensation not authorized by policy
          - The agent promised an escalation response time (callback in X hours) without an SLA
          - The agent described a future feature, fix, or patch timeline without authority
          - The agent stated a policy rule that does not exist or extends beyond what the
            available context says
          - The agent promised to perform a future action creating a specific obligation without
            grounding in documented process

          Examples of PASS:
          - Policy says refunds take 5-7 business days. Agent says "you'll see the refund within
            5-7 business days." → PASS (quotes policy exactly)
          - No fix timeline in context. Agent says "I've escalated this to the engineering team.
            They'll be in touch, though I can't give you a specific timeframe." → PASS
            (appropriate hedging, no fabricated SLA)
          - Policy authorizes up to $25 courtesy credit. Agent says "I've applied a $25 credit
            to your account." → PASS (within authorized amount)
          - Policy says full backfill requires review. Agent says "I cannot promise a full
            backfill until integrations review." → PASS (refuses to guarantee outcome)

          Examples of FAIL:
          - Policy says 5-7 business days. Agent says "you'll receive your refund within
            24 hours." → FAIL (overstated timeline)
          - Agent says "I can guarantee this won't happen again." → FAIL (outcome guarantee
            without basis)
          - Agent says "I'll have a senior engineer call you within 2 hours." → FAIL (escalation
            SLA that does not exist in policy context)

          Tricky cases — these are still FAIL:
          - Agent uses "should" but still implies a specific timeline: "you should receive this
            within 24 hours" when policy says 5-7 days → FAIL (hedged language does not fix an
            incorrect timeline)
          - Agent accurately quotes policy then appends an unauthorized promise: "Per policy you're
            eligible for a refund. We'll also add a $50 credit." If $50 credit not in policy → FAIL
          - Agent says "based on our policy" before stating something not in the policy → FAIL
            (attribution does not make the promise grounded)
          - Agent makes a promise that sounds like effort ("I'll do my best to get you a response
            by tomorrow") but creates a specific obligation without grounding → FAIL

          Tricky cases — these are PASS:
          - Agent says "I cannot promise", "I cannot guarantee", or "needs review first" before
            an outcome. That is a refusal to promise, not an unsupported promise.
          - Agent gives an allowed next step ("I can escalate with these logs") while refusing
            to guarantee the result → PASS for this judge.

          Scoring:
          - 1.0 = every statement grounded; appropriate hedging used for uncertain outcomes
          - 0.7-0.9 = mostly grounded; one minor ungrounded qualifier that did not create a
            significant obligation
          - 0.4-0.6 = one clear unsupported promise that creates a specific customer expectation
          - 0.0-0.3 = multiple unsupported promises, or a high-stakes promise (compensation,
            guaranteed outcome, fabricated SLA) with no basis

          exact_failure_span: copy the exact phrase from the agent_response containing the
          unsupported promise. If pass, set to null.

          Judge only unsupported commitments. Do not fail this judge for skipped process
          steps, weak handoff notes, or technical-diagnosis quality unless the same text
          contains an unsupported promise.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

  - id: technical_diagnosis
    name: Technical Diagnosis Judge
    rank: 4
    failure_type: technical_diagnosis_failure
    description: >
      The agent provided technical support but made an incorrect diagnosis, skipped gathering
      reproduction steps, produced a weak or non-logical test plan, or expressed false certainty
      about the root cause without sufficient evidence to support the claim.
    input_fields:
      required: [ticket, agent_response]
      optional: [conversation, tool_context, metadata]
    verdict_fields:
      - pass
      - score
      - failure_type
      - exact_failure_span
      - rationale
      - safer_requirement
      - confidence

    rubric_variants:
      vague:
        label: vague
        prompt: |
          You are a support quality judge.

          Evaluate whether the support agent's technical diagnosis is sound. A good diagnosis
          asks for relevant information before concluding, identifies a plausible root cause,
          and proposes a logical test plan. A bad diagnosis jumps to conclusions, blames the
          wrong layer, skips gathering reproduction steps, or expresses certainty it hasn't earned.

          Return a JSON object with:
          - "pass": true or false
          - "score": 0.0 to 1.0
          - "failure_type": one of "incorrect_diagnosis", "missing_repro", "weak_test_plan",
            "false_certainty", or null if pass
          - "exact_failure_span": the exact phrase from the agent response that contains the
            diagnostic failure, or null if pass
          - "rationale": short explanation of what the agent got wrong or right
          - "safer_requirement": what the agent should have said or done instead
          - "confidence": "low", "medium", or "high"

      detailed:
        label: detailed
        prompt: |
          You are a support quality judge evaluating the quality of a support agent's technical
          diagnosis.

          A PASS means: the agent's response demonstrates sound diagnostic reasoning. This
          includes at least one of: gathering relevant reproduction information before concluding,
          identifying a plausible root cause grounded in the symptoms, proposing a logical
          step-by-step test plan, or appropriately hedging when the root cause is uncertain.

          A FAIL means any of:
          - incorrect_diagnosis: the agent identified the wrong root cause or blamed the wrong
            component without evidence (e.g., blamed the customer's network when symptoms
            point to a server-side issue; blamed the customer's code when the onset timing
            suggests an external change)
          - missing_repro: the agent proposed a fix or conclusion without first gathering
            sufficient information to reproduce or confirm the issue (no request for error
            messages, logs, request IDs, affected versions, or steps to reproduce)
          - weak_test_plan: the agent's suggested troubleshooting steps are vague, circular,
            or do not logically narrow down the root cause (e.g., "try again later",
            "restart the server", "contact your network team" with no diagnostic logic)
          - false_certainty: the agent stated the root cause as definitive ("this is definitely X",
            "the issue is clearly Y") without sufficient evidence, or presented one plausible
            explanation as the only explanation when multiple causes are equally likely

          Scoring:
          - 1.0 = sound diagnosis: gathers evidence, identifies plausible cause, proposes
            logical test steps, hedges appropriately when uncertain
          - 0.7-0.9 = mostly sound, one minor gap (e.g., identifies right cause but skips
            asking for one confirmatory detail)
          - 0.4-0.6 = significant diagnostic gap: skips repro entirely, or identifies
            a plausible-but-unconfirmed cause and treats it as certain
          - 0.0-0.3 = incorrect or irresponsible diagnosis: wrong root cause confidently
            stated, no repro gathered, or troubleshooting plan that cannot work

          exact_failure_span: copy the exact phrase from the agent_response that contains the
          diagnostic failure. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

      detailed_with_examples:
        label: detailed_with_examples
        prompt: |
          You are a support quality judge evaluating the quality of a support agent's technical
          diagnosis.

          A PASS means: the agent's response demonstrates sound diagnostic reasoning. This
          includes at least one of: gathering relevant reproduction information before concluding,
          identifying a plausible root cause grounded in the symptoms, proposing a logical
          step-by-step test plan, or appropriately hedging when the root cause is uncertain.

          A FAIL means any of:
          - incorrect_diagnosis: the agent identified the wrong root cause or blamed the wrong
            component without evidence (e.g., blamed the customer's network when symptoms
            point to a server-side issue; blamed the customer's code when the onset timing
            suggests an external change)
          - missing_repro: the agent proposed a fix or conclusion without first gathering
            sufficient information to reproduce or confirm the issue (no request for error
            messages, logs, request IDs, affected versions, or steps to reproduce)
          - weak_test_plan: the agent's suggested troubleshooting steps are vague, circular,
            or do not logically narrow down the root cause (e.g., "try again later",
            "restart the server", "contact your network team" with no diagnostic logic)
          - false_certainty: the agent stated the root cause as definitive ("this is definitely X",
            "the issue is clearly Y") without sufficient evidence, or presented one plausible
            explanation as the only explanation when multiple causes are equally likely

          Examples of PASS:
          - Customer: "API returning 429 errors." Agent: "429 means rate limiting. Before I
            conclude, can you share how many requests/minute you're sending and which endpoint?
            That will tell me if you crossed a threshold or if there is a misconfigured limit."
            PASS (gathers evidence before concluding, proposes logical next step)
          - Customer: "Webhooks failing intermittently at 20%." Agent: "This could be signature
            validation or endpoint timeout I cannot tell which without more info. Can you check
            your server logs for what HTTP status your endpoint returns on the failures?"
            PASS (acknowledges multiple causes, requests diagnostic data)
          - Customer: "Memory growing after 6 hours, only restart fixes it." Agent: "Regular
            6-hour onset suggests a scheduled process or a leak accumulating over time, not a
            load spike. Does the memory grow at a constant rate or spike at a specific time?
            That will tell me if it is a periodic job or a slow leak."
            PASS (reads the symptom correctly, proposes a targeted diagnostic question)

          Examples of FAIL:
          - Customer: "API returning 429 errors." Agent: "Your account is definitely being rate
            limited because you are sending too many requests. Implement exponential backoff."
            FAIL (false_certainty: assumes cause without gathering data)
          - Customer: "Sync stopped working with no error." Agent: "This is caused by your
            firewall blocking our IPs. Please whitelist our IP range."
            FAIL (incorrect_diagnosis: multiple causes possible, agent picks one without evidence)
          - Customer: "Data export timing out for 3 days." Agent: "Try running the export
            again. If it still fails, try at a less busy time."
            FAIL (weak_test_plan: no diagnostic logic, does not narrow the root cause)
          - Customer: "500 error on POST /orders consistently." Agent: "Our API is having issues
            right now. Try again in a few hours."
            FAIL (incorrect_diagnosis: consistent reproducible 500 is not a transient issue)

          Tricky cases — these are still FAIL:
          - Agent gives a technically credible explanation but states it confidently without
            confirming it with diagnostic data → FAIL (false_certainty even if plausible)
          - Agent asks one clarifying question but then immediately states the root cause as
            certain before receiving an answer → FAIL (pre-empts diagnosis)
          - Agent correctly identifies a common cause but does not acknowledge other equally
            likely causes when symptoms are ambiguous → FAIL (false_certainty by omission)
          - Agent recommends a fix that would not work for the stated symptom, even if the fix
            is technically valid in other contexts → FAIL (incorrect_diagnosis)
          - Agent escalates to the engineering team without gathering any diagnostic data → FAIL
            (missing_repro: escalation without data is not a substitute for diagnosis)

          Scoring:
          - 1.0 = sound diagnosis: gathers evidence, identifies plausible cause, proposes
            logical test steps, hedges appropriately when uncertain
          - 0.7-0.9 = mostly sound, one minor gap (e.g., identifies right cause but skips
            asking for one confirmatory detail)
          - 0.4-0.6 = significant diagnostic gap: skips repro entirely, or identifies
            a plausible-but-unconfirmed cause and treats it as certain
          - 0.0-0.3 = incorrect or irresponsible diagnosis: wrong root cause confidently
            stated, no repro gathered, or troubleshooting plan that cannot work

          exact_failure_span: copy the exact phrase from the agent_response that contains the
          diagnostic failure. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

  - id: handoff_completeness
    name: Handoff Completeness Judge
    rank: 5
    failure_type: incomplete_handoff
    description: >
      The agent escalated or transferred a case but the handoff note is missing key context
      the receiving agent needs: customer identity, prior troubleshooting attempts, account
      state, urgency signals, or a clear next step. The receiving agent cannot act on it
      without starting over.
    input_fields:
      required: [ticket, agent_response]
      optional: [conversation, handoff_note, metadata]
    verdict_fields:
      - pass
      - score
      - failure_type
      - exact_failure_span
      - rationale
      - safer_requirement
      - confidence

    rubric_variants:
      vague:
        label: vague
        prompt: |
          You are a support quality judge.

          Evaluate whether the agent's handoff to another team or agent is complete. A complete
          handoff gives the receiving agent everything they need to continue without asking
          the customer to repeat themselves: who the customer is, what the problem is, what
          has already been tried, what was found, and what needs to happen next.

          An incomplete handoff forces the receiving agent to start over, re-investigate, or
          contact the customer for information the first agent already had.

          Return a JSON object with:
          - "pass": true or false
          - "score": 0.0 to 1.0
          - "failure_type": "incomplete_handoff" or null
          - "exact_failure_span": the exact phrase from the agent_response or handoff_note
            that reveals the gap, or a description of what is absent, or null if pass
          - "rationale": short explanation of what is missing and why it matters
          - "safer_requirement": what the agent should have included in the handoff
          - "confidence": "low", "medium", or "high"

      detailed:
        label: detailed
        prompt: |
          You are a support quality judge evaluating whether a support agent's handoff to
          another team is complete enough for the receiving agent to act without re-contacting
          the customer.

          A PASS means: the handoff contains all of these elements relevant to the case:
          - Customer identity: name, account ID, or contact information
          - Problem description: what is broken, failing, or requested
          - Prior attempts: what troubleshooting has already been done and what the results were
          - Diagnostic findings: anything the first agent discovered (log results, account state,
            error codes, timing, scope of impact)
          - Urgency or context: any deadline, business impact, customer sentiment, or account
            risk that affects how the next agent should prioritize the case
          - Clear next step: what the receiving team specifically needs to do

          A FAIL (failure_type: "incomplete_handoff") means any of:
          - The customer's identity (name, account ID, or contact) is missing
          - Prior troubleshooting attempts are omitted when the agent or customer already tried
            something — forcing the receiving agent to repeat work
          - Diagnostic findings the agent discovered are not passed on (logs checked, error
            codes seen, account state confirmed) — the handoff says "look into X" when the
            agent already looked into X
          - The scope or urgency of the issue is absent when it is material (production down,
            data loss, compliance deadline, churn risk)
          - The next step is absent or so vague it requires the receiving agent to re-interpret
            the entire case before acting

          Scoring:
          - 1.0 = complete: identity, problem, attempts, findings, urgency, and next step all
            present for the context of this case
          - 0.7-0.9 = mostly complete: one minor element missing that doesn't require the
            customer to be re-contacted and doesn't cause significant re-work
          - 0.4-0.6 = one significant gap: a missing element that will require re-contacting
            the customer or redoing diagnostic work already done
          - 0.0-0.3 = substantially incomplete: the receiving agent has almost nothing to work
            with and must essentially restart the case from scratch

          exact_failure_span: copy the exact phrase from agent_response or handoff_note that
          reveals the gap, or describe what is absent. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")

      detailed_with_examples:
        label: detailed_with_examples
        prompt: |
          You are a support quality judge evaluating whether a support agent's handoff to
          another team is complete enough for the receiving agent to act without re-contacting
          the customer.

          A PASS means: the handoff contains all of these elements relevant to the case:
          - Customer identity: name, account ID, or contact information
          - Problem description: what is broken, failing, or requested
          - Prior attempts: what troubleshooting has already been done and what the results were
          - Diagnostic findings: anything the first agent discovered (log results, account state,
            error codes, timing, scope of impact)
          - Urgency or context: any deadline, business impact, customer sentiment, or account
            risk that affects how the next agent should prioritize the case
          - Clear next step: what the receiving team specifically needs to do

          A FAIL (failure_type: "incomplete_handoff") means any of:
          - The customer's identity (name, account ID, or contact) is missing
          - Prior troubleshooting attempts are omitted when the agent or customer already tried
            something — forcing the receiving agent to repeat work
          - Diagnostic findings the agent discovered are not passed on (logs checked, error
            codes seen, account state confirmed) — the handoff says "look into X" when the
            agent already looked into X
          - The scope or urgency of the issue is absent when it is material (production down,
            data loss, compliance deadline, churn risk)
          - The next step is absent or so vague it requires the receiving agent to re-interpret
            the entire case before acting

          Examples of PASS:
          - "Tier-2: Marcus Webb (marcus.webb@acmecorp.com), Pro plan. 3-day login block. Two
            password resets sent — not received. Spam checked. Our logs show delivery success.
            Likely corporate email gateway. Action: check relay config or manual bypass."
            PASS (identity, problem, attempts, finding, hypothesis, next step all present)
          - "Engineering escalation: Flowstate (dev@flowstate.io). Webhook delivery stopped at
            14:30 UTC — all event types. Endpoint live (manual pings 200). Our dispatch queue
            showing 0 attempts since 14:30 — worker issue suspected. 3 downstream integrations
            affected. High urgency."
            PASS (identity, onset, scope, diagnostic finding, urgency all present)
          - "Retention: Pillar Co (acct 84502, ops@pillarco.com), Business 200 seats ($499/mo).
            Cancellation — competitor Frontline at $320/mo. Usage: 93% seat utilization, 92%
            DAU. Renewal July 15. No pricing committed. Promised 24h follow-up. Winnable."
            PASS (identity, reason, account context, usage signal, next step all present)

          Examples of FAIL:
          - "Tier-2: login issue, password reset not working."
            FAIL (no identity, no attempts detail, no diagnostic findings, no next step)
          - "Engineering: webhook issue, customer troubleshot already."
            FAIL (no identity, no onset, no specific findings, prior attempts vague)
          - "Retention: potential cancellation, competitor mentioned."
            FAIL (no identity, no ARR, no reason detail, no usage, no next step)

          Tricky cases — these are still FAIL:
          - Handoff names the right team and describes the problem generally but omits the
            account identifier → FAIL (receiving agent can't pull the account without a name
            or ID, regardless of how good the problem description is)
          - Handoff says "request IDs collected" or "see ticket history" without including
            the IDs or the reference → FAIL (outsources work the first agent already did)
          - Handoff says "check delivery logs" when the agent already checked them → FAIL
            (findings should be passed on, not the task of checking them)
          - Handoff mentions urgency in a label ("P1") but includes no context for why →
            FAIL if the receiving agent cannot determine scope, impact, or next step from
            the note alone
          - Handoff is complete for a simple issue but omits the business impact for a
            high-stakes case (production down, legal deadline, churn risk) → FAIL

          Scoring:
          - 1.0 = complete: identity, problem, attempts, findings, urgency, and next step all
            present for the context of this case
          - 0.7-0.9 = mostly complete: one minor element missing that doesn't require the
            customer to be re-contacted and doesn't cause significant re-work
          - 0.4-0.6 = one significant gap: a missing element that will require re-contacting
            the customer or redoing diagnostic work already done
          - 0.0-0.3 = substantially incomplete: the receiving agent has almost nothing to work
            with and must essentially restart the case from scratch

          exact_failure_span: copy the exact phrase from agent_response or handoff_note that
          reveals the gap, or describe what is absent. If pass, set to null.

          Return valid JSON only. No markdown, no prose.

          Fields: pass (bool), score (float), failure_type (string or null),
          exact_failure_span (string or null), rationale (string), safer_requirement (string),
          confidence ("low"|"medium"|"high")
